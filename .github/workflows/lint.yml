---
name: Lint and unit tests

"on":
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    uses: test-kitchen/.github/.github/workflows/lint-unit.yml@main
    with:
      bundle_without: development:smoke

  smoke-config:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: development:cookstyle
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check the Apache smoke suites
        run: bundle exec ruby examples/apache2/check.rb virtualbox ubuntu-2404-virtualbox 'sudo '
