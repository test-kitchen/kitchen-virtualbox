---
name: Lint and unit tests

"on":
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    uses: test-kitchen/.github/.github/workflows/lint-unit.yml@main
    with:
      bundle_without: development:smoke

  smoke-config:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: development:cookstyle
    steps:
      - uses: actions/checkout@v7
      - name: Check out the canonical Apache fixture
        uses: actions/checkout@v7
        with:
          repository: test-kitchen/test-kitchen
          ref: 4bbf9023c2dd6a8a54663fe19c7a7ba419abad35
          path: .apache-fixture-source
          persist-credentials: false
          sparse-checkout: test/fixtures/apache2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the shared fixture files
        run: ruby .apache-fixture-source/test/fixtures/apache2/sync.rb --check .
      - name: Check the Apache smoke suites
        run: bundle exec ruby examples/apache2/check.rb virtualbox ubuntu-2404-virtualbox 'sudo '
